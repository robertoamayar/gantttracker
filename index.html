<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GanttTracker Pro — APP CAFIVER</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#1a73e8;min-height:100vh;color:#1c1e21;font-size:13px;}
body.app-mode{background:#f5f6f8;}
.hidden{display:none!important;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#c8cad0;border-radius:3px;}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.lcard{background:#fff;border-radius:16px;padding:2rem;width:460px;max-height:95vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,.3);}
.lcard h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px;}
.lcard .sub{font-size:12px;color:#5f6368;text-align:center;margin-bottom:16px;}
.section-title{font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.user-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.u-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid #e0e2e6;border-radius:10px;cursor:pointer;background:#fff;transition:all .15s;text-align:left;}
.u-card:hover{border-color:#1a73e8;background:#e8f0fe;}
.u-card .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.u-card .u-info{flex:1;min-width:0;}
.u-card .u-name{font-size:13px;font-weight:600;}
.u-card .u-email{font-size:11px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.u-card .u-email.missing{color:#ea4335;}
.email-editor{background:#f8f9fa;border-radius:10px;padding:12px;margin-bottom:14px;}
.email-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.email-row:last-child{margin-bottom:0;}
.email-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;}
.email-name{font-size:12px;font-weight:500;min-width:64px;flex-shrink:0;}
.email-inp{flex:1;font-size:12px;padding:5px 8px;border:1.5px solid #e0e2e6;border-radius:6px;outline:none;font-family:'Inter',sans-serif;}
.email-inp:focus{border-color:#1a73e8;}
.del-btn{background:none;border:none;cursor:pointer;color:#ea4335;font-size:13px;padding:2px 5px;border-radius:4px;}
.del-btn:hover{background:#fce8e6;}
.divider{border-top:1px solid #e0e2e6;margin:14px 0;}
.form-col{display:flex;flex-direction:column;gap:8px;}
.fi{font-size:13px;padding:9px 12px;border:1.5px solid #e0e2e6;border-radius:8px;outline:none;font-family:'Inter',sans-serif;width:100%;}
.fi:focus{border-color:#1a73e8;}
.btn-add{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s;}
.btn-add:hover{background:#1557b0;}

/* SYNC STATUS */
.sync-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;border-radius:8px;font-size:11px;font-weight:500;margin-bottom:12px;}
.sync-bar.ok{background:#e6f4ea;color:#2d6a2d;}
.sync-bar.loading{background:#e8f0fe;color:#1a73e8;}
.sync-bar.error{background:#fce8e6;color:#c0392b;}
.sync-dot{width:7px;height:7px;border-radius:50%;}
.sync-bar.ok .sync-dot{background:#34a853;}
.sync-bar.loading .sync-dot{background:#1a73e8;animation:pulse .8s infinite;}
.sync-bar.error .sync-dot{background:#ea4335;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* APP */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{height:52px;background:#fff;border-bottom:1px solid #e0e2e6;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;z-index:50;}
.logo-mark{width:28px;height:28px;background:#1a73e8;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
.proj-name{font-size:14px;font-weight:700;}
.tnav{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:#5f6368;cursor:pointer;border:none;background:none;transition:all .15s;font-family:'Inter',sans-serif;}
.tnav:hover{background:#f0f1f3;color:#1c1e21;}
.tnav.on{background:#e8f0fe;color:#1a73e8;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.user-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:#f0f1f3;font-size:12px;font-weight:500;}
.cu-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:6px;border:1px solid #c8cad0;background:#fff;color:#1c1e21;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap;}
.btn:hover{background:#f0f1f3;}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-blue{background:#1a73e8;color:#fff;border-color:#1a73e8;}
.btn-blue:hover{background:#1557b0;}
.btn-red{background:#fce8e6;color:#ea4335;border-color:transparent;}
.btn-red:hover{background:#fbd7d4;}

/* SYNC INDICATOR IN TOPBAR */
.sync-pill{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:500;}
.sync-pill.ok{background:#e6f4ea;color:#2d6a2d;}
.sync-pill.saving{background:#e8f0fe;color:#1a73e8;}
.sync-pill.error{background:#fce8e6;color:#c0392b;}

.secbar{height:38px;background:#fff;border-bottom:1px solid #e0e2e6;display:flex;align-items:center;padding:0 14px;gap:6px;flex-shrink:0;}
.secbar-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:#5f6368;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;transition:all .15s;}
.secbar-btn:hover{background:#f0f1f3;}
.today-btn{color:#1a73e8;font-weight:700;}
.sep{width:1px;height:18px;background:#e0e2e6;margin:0 2px;}

/* GANTT */
.gantt-shell{flex:1;display:flex;overflow:hidden;}
.gantt-left{width:420px;min-width:420px;display:flex;flex-direction:column;border-right:2px solid #e0e2e6;overflow:hidden;flex-shrink:0;}
.gl-head{height:34px;display:grid;grid-template-columns:1fr 72px;align-items:center;background:#f0f1f3;border-bottom:1px solid #e0e2e6;padding:0 8px;flex-shrink:0;}
.gl-head span{font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:.04em;}
.gl-body{overflow-y:auto;overflow-x:hidden;flex:1;}
.grow{height:34px;display:grid;grid-template-columns:1fr 72px;align-items:center;border-bottom:1px solid #e0e2e6;cursor:pointer;transition:background .1s;user-select:none;}
.grow:hover{background:#f7f8ff;}
.grow.grp{background:#f0f1f3;cursor:default;}
.grow.grp:hover{background:#ecedf0;}
.grow.sel{background:#e8f0fe!important;}
.gcell-n{display:flex;align-items:center;gap:5px;padding:0 8px;overflow:hidden;}
.gcell-p{text-align:center;font-size:12px;font-weight:700;padding-right:8px;}
.gtog{background:none;border:none;cursor:pointer;color:#9aa0a6;font-size:10px;padding:2px;flex-shrink:0;transition:transform .2s;line-height:1;}
.gtog.open{transform:rotate(90deg);}
.task-lbl{font-size:12px;color:#1c1e21;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.task-indent{width:18px;flex-shrink:0;}
.gantt-right{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.cal-hd-wrap{flex-shrink:0;overflow:hidden;}
.month-hd{height:20px;display:flex;background:#e8eaed;border-bottom:1px solid #e0e2e6;}
.month-seg{display:flex;align-items:center;font-size:11px;font-weight:700;color:#5f6368;border-right:1px solid #e0e2e6;padding:0 6px;white-space:nowrap;overflow:hidden;}
.day-hd{display:flex;height:34px;background:#f0f1f3;border-bottom:1px solid #e0e2e6;}
.day-col{width:28px;min-width:28px;border-right:1px solid #e0e2e6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
.day-col .dow{color:#9aa0a6;font-weight:500;line-height:1;}
.day-col .dom{font-weight:600;color:#5f6368;line-height:1.5;font-size:10px;}
.day-col.tod .dom{background:#1a73e8;color:#fff;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;}
.day-col.tod .dow{color:#1a73e8;}
.day-col.we{background:#fafafa;}
.cal-bw{flex:1;overflow:auto;position:relative;}
.cal-b{position:relative;}
.cal-row{height:34px;display:flex;position:relative;border-bottom:1px solid #e0e2e6;}
.cal-row.grp-r{background:#f0f1f3;}
.dcell{width:28px;min-width:28px;border-right:1px solid #e0e2e6;height:100%;flex-shrink:0;}
.dcell.we{background:#fafafa;}
.dcell.tod{background:#e8f0fe18;}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:18px;border-radius:4px;cursor:pointer;overflow:hidden;display:flex;align-items:center;}
.bar:hover{filter:brightness(.9);}
.bar-bg{position:absolute;inset:0;border-radius:4px;}
.bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;}
.bar-txt{position:relative;z-index:1;font-size:10px;font-weight:600;color:#fff;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.tline{position:absolute;top:0;bottom:0;width:2px;background:#1a73e8;opacity:.8;z-index:10;pointer-events:none;}

/* DETAIL PANEL */
#dp{position:fixed;top:0;right:0;width:500px;height:100vh;background:#fff;border-left:1px solid #e0e2e6;z-index:200;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.1);transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
#dp.open{transform:translateX(0);}
.dp-pct-bar{height:5px;background:#1a73e8;transition:width .3s;}
.dp-hd{padding:14px 18px 10px;border-bottom:1px solid #e0e2e6;flex-shrink:0;}
.dp-title-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;}
.dp-title{flex:1;font-size:15px;font-weight:700;border:none;outline:none;background:transparent;resize:none;line-height:1.4;font-family:'Inter',sans-serif;color:#1c1e21;}
.dp-acts{display:flex;gap:4px;flex-shrink:0;}
.dp-ib{background:none;border:none;cursor:pointer;color:#9aa0a6;font-size:15px;padding:4px;border-radius:6px;transition:all .15s;}
.dp-ib:hover{background:#f0f1f3;color:#5f6368;}
.dp-ib.dng:hover{background:#fce8e6;color:#ea4335;}
.dp-meta{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.dp-mf label{display:block;font-size:10px;font-weight:700;color:#9aa0a6;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.dp-pct-blk{display:flex;align-items:center;gap:8px;background:#e8f0fe;border-radius:8px;padding:6px 10px;}
.dp-pct-n{font-size:18px;font-weight:700;color:#1a73e8;width:42px;border:none;background:transparent;outline:none;font-family:'Inter',sans-serif;}
.dp-pct-s{flex:1;min-width:80px;accent-color:#1a73e8;}
.dp-date{font-size:12px;padding:5px 8px;border:1.5px solid #e0e2e6;border-radius:6px;outline:none;}
.dp-date:focus{border-color:#1a73e8;}
.dp-tabs{display:flex;border-bottom:1px solid #e0e2e6;padding:0 18px;flex-shrink:0;}
.dp-tab{padding:9px 14px;font-size:12px;font-weight:600;color:#5f6368;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;font-family:'Inter',sans-serif;}
.dp-tab:hover{color:#1c1e21;}
.dp-tab.on{color:#1a73e8;border-bottom-color:#1a73e8;}
.dp-body{flex:1;overflow-y:auto;padding:16px 18px;}
.dp-sec{margin-bottom:14px;}
.dp-sec-t{font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.dp-fr{display:grid;grid-template-columns:130px 1fr;align-items:center;padding:7px 0;border-bottom:1px solid #e0e2e6;}
.dp-fr:last-child{border-bottom:none;}
.dp-fk{font-size:12px;color:#5f6368;font-weight:500;}
.dp-fv input,.dp-fv select,.dp-fv textarea{width:100%;font-size:12px;padding:4px 8px;border:1.5px solid #e0e2e6;border-radius:6px;outline:none;font-family:'Inter',sans-serif;}
.dp-fv input:focus,.dp-fv select:focus{border-color:#1a73e8;}
.dp-fv textarea{resize:vertical;min-height:90px;line-height:1.5;}
.sem-row{display:flex;gap:8px;}
.sem-opt{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;cursor:pointer;border:1.5px solid #e0e2e6;font-size:11px;font-weight:600;transition:all .15s;}
.sem-g{color:#34a853;} .sem-g.on{background:#e6f4ea;border-color:#34a853;}
.sem-y{color:#f9ab00;} .sem-y.on{background:#fef7e0;border-color:#f9ab00;}
.sem-r{color:#ea4335;} .sem-r.on{background:#fce8e6;border-color:#ea4335;}
.semdot{width:9px;height:9px;border-radius:50%;}
.notes-area{width:100%;min-height:120px;font-size:13px;padding:10px;border:1.5px solid #e0e2e6;border-radius:8px;outline:none;line-height:1.6;resize:vertical;font-family:'Inter',sans-serif;}
.notes-area:focus{border-color:#1a73e8;}
.c-box{display:flex;gap:8px;margin-bottom:14px;}
.c-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px;}
.c-inp{flex:1;font-size:12px;padding:8px 10px;border:1.5px solid #e0e2e6;border-radius:8px;outline:none;font-family:'Inter',sans-serif;}
.c-inp:focus{border-color:#1a73e8;}
.c-item{display:flex;gap:8px;margin-bottom:10px;}
.c-txt{flex:1;background:#f0f1f3;border-radius:8px;padding:8px 10px;}
.c-author{font-size:11px;font-weight:700;margin-bottom:2px;}
.c-body{font-size:12px;color:#5f6368;line-height:1.5;}
.c-time{font-size:10px;color:#9aa0a6;margin-top:3px;}
.pred-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #e0e2e6;font-size:12px;}
.pred-item:last-child{border-bottom:none;}
.no-pred{font-size:12px;color:#9aa0a6;font-style:italic;padding:6px 0;}
#dp-overlay{position:fixed;inset:0;z-index:199;display:none;}
#dp-overlay.on{display:block;}

/* MODALS */
#at-overlay,#confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:400;}
.at-card,.confirm-card{background:#fff;border-radius:12px;padding:1.5rem;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.at-card{width:480px;max-width:96vw;max-height:92vh;overflow-y:auto;}
.confirm-card{width:340px;}
.at-card h3,.confirm-card h3{font-size:15px;font-weight:700;margin-bottom:1rem;}
.confirm-card p{font-size:13px;color:#5f6368;line-height:1.6;margin-bottom:1rem;}
.confirm-btns,.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;padding-top:1rem;border-top:1px solid #e0e2e6;}
.af{margin-bottom:10px;}
.af label{display:block;font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.af input,.af select,.af textarea{width:100%;font-size:12px;padding:7px 10px;border:1.5px solid #e0e2e6;border-radius:7px;outline:none;font-family:'Inter',sans-serif;}
.af input:focus,.af select:focus{border-color:#1a73e8;}
.af textarea{resize:vertical;min-height:70px;line-height:1.5;}
.af-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.view-wrap{flex:1;overflow:auto;padding:1rem 1.5rem;}
.tbl-box{background:#fff;border:1px solid #e0e2e6;border-radius:12px;overflow:hidden;}
.tbl-hdr{padding:10px 14px;background:#f0f1f3;border-bottom:1px solid #e0e2e6;display:flex;align-items:center;justify-content:space-between;}
.tbl-hdr span{font-size:13px;font-weight:700;}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#5f6368;padding:7px 10px;border-bottom:1px solid #e0e2e6;background:#f0f1f3;text-align:left;white-space:nowrap;}
td{padding:7px 10px;border-bottom:1px solid #e0e2e6;font-size:12px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.empty-state{padding:2rem;text-align:center;color:#9aa0a6;font-size:13px;}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:#323232;color:#fff;padding:8px 20px;border-radius:8px;font-size:12px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:999;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media print{#dp,#dp-overlay,#at-overlay,#confirm-overlay,.topbar-right,.secbar{display:none!important;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="lcard">
    <h1>GanttTracker Pro</h1>
    <p class="sub">APP CAFIVER</p>
    <div id="sync-status" class="sync-bar loading">
      <div class="sync-dot"></div>
      <span id="sync-msg">Conectando a Firebase...</span>
    </div>
    <div class="section-title">¿Quién eres?</div>
    <div class="user-list" id="user-list">
      <div style="color:#9aa0a6;font-size:12px;text-align:center;padding:8px;">Cargando usuarios...</div>
    </div>
    <div class="divider"></div>
    <div class="section-title">Correos de notificación</div>
    <div class="email-editor" id="email-editor">
      <div style="color:#9aa0a6;font-size:12px;">Cargando...</div>
    </div>
    <div class="divider"></div>
    <div class="section-title">Nuevo usuario</div>
    <div class="form-col">
      <input class="fi" type="text" id="inp-name" placeholder="Nombre completo..." maxlength="30">
      <input class="fi" type="email" id="inp-email" placeholder="correo@empresa.com">
      <button class="btn-add" onclick="addUser()">+ Agregar usuario</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo-mark">G</div>
    <span class="proj-name">APP CAFIVER</span>
    <button class="tnav on" id="tnav-gantt" onclick="switchView('gantt')">▦ Gantt</button>
    <button class="tnav" id="tnav-daily" onclick="switchView('daily')">📅 Diario</button>
    <button class="tnav" id="tnav-hist" onclick="switchView('hist')">◷ Historial</button>
    <div class="topbar-right">
      <div class="sync-pill ok" id="topbar-sync">
        <div class="sync-dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;"></div>
        <span id="topbar-sync-txt">En línea</span>
      </div>
      <div class="user-pill">
        <div class="cu-av" id="cur-av"></div>
        <span id="cur-nm"></span>
      </div>
      <button class="btn btn-sm" onclick="openAddTask()">+ Tarea</button>
      <button class="btn btn-sm" onclick="window.print()">🖨</button>
      <button class="btn btn-sm" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="secbar" id="secbar">
    <button class="secbar-btn today-btn" onclick="goToday()">Today</button>
    <div class="sep"></div>
    <button class="secbar-btn" onclick="shiftDays(-14)">◀</button>
    <span id="date-range-lbl" style="font-size:12px;color:#5f6368;font-weight:500;min-width:220px;text-align:center;"></span>
    <button class="secbar-btn" onclick="shiftDays(14)">▶</button>
    <div class="sep"></div>
    <button class="secbar-btn" onclick="openAddTask()">+ Tarea</button>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
      <span style="font-size:11px;color:#5f6368;">Responsable:</span>
      <select id="resp-fil" onchange="renderGantt()" style="font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid #e0e2e6;">
        <option value="ALL">Todos</option>
        <option value="U">Usuario</option><option value="T">TI</option>
        <option value="P">Proveedor</option><option value="S">Compartido</option>
      </select>

async function fbSave(col, data) {

  } catch(e) {
    console.error('Firebase save error:', e);
    setSyncStatus('error','Error al guardar');
    toast('⚠️ Error guardando en Firebase: ' + e.message);
  }
}

async function fbSaveTask(task) {
  if(!task || !task.id){ toast('⚠️ Tarea sin ID'); return; }
  try {
    setSyncStatus('saving','Guardando...');
    // Clean task object — remove undefined values that Firestore rejects
    var clean = {};
    Object.keys(task).forEach(function(k){ if(task[k]!==undefined) clean[k]=task[k]; });
    await setDoc(doc(db, 'tasks', clean.id), clean);
    setSyncStatus('ok','En línea ✓');
    toast('✅ Guardado en Firebase');
  } catch(e) {
    console.error('Firebase task save error:', e.code, e.message);
    setSyncStatus('error','Error al guardar');
    if(e.code === 'permission-denied'){
      toast('🔒 Error: Sin permisos en Firebase. Revisa las Reglas de Firestore.');
    } else if(e.code === 'unavailable'){
      toast('📡 Sin conexión a internet. Guardado localmente.');
      localStorage.setItem('gt_tasks', JSON.stringify(tasks));
    } else {
      toast('⚠️ Error Firebase: ' + e.message);
    }
  }
}

// ═══════════════════════════════════════════
// LOAD FROM FIREBASE WITH REAL-TIME LISTENER
// ═══════════════════════════════════════════
async function initFirebase() {
  try {
    setSyncStatus('loading','Conectando...');

    // Load users
    const usersSnap = await getDocs(collection(db, 'users'));
    if (usersSnap.empty) {
      users = [
        {id:'u1',name:'Bob',        email:'',color:AVCOLORS[0]},
        {id:'u2',name:'TI Lead',    email:'',color:AVCOLORS[1]},
        {id:'u3',name:'Proveedor',  email:'',color:AVCOLORS[2]}
      ];
      for (const u of users) await setDoc(doc(db,'users',u.id), u);
    } else {
      users = usersSnap.docs.map(d => ({id:d.id,...d.data()}));
    }

    // Load tasks — with real-time listener
    const tasksSnap = await getDocs(collection(db,'tasks'));
    if (tasksSnap.empty) {
      tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
      for (const t of tasks) await setDoc(doc(db,'tasks',t.id), t);
    } else {
      tasks = tasksSnap.docs.map(d => ({...d.data()}));
    }

    // Load comments
    const commentsSnap = await getDocs(collection(db,'comments'));
    comments = commentsSnap.docs.map(d => ({id:d.id,...d.data()}));

    // Load daily logs
    const logsSnap = await getDocs(collection(db,'dailylogs'));
    dailyLogs = logsSnap.docs.map(d => ({id:d.id,...d.data()}));

    // Load history
    const histSnap = await getDocs(collection(db,'history'));
    history = histSnap.empty ? [] : (histSnap.docs[0].data().items || []);

    // Real-time listener for tasks
    onSnapshot(collection(db,'tasks'), (snap) => {
      tasks = snap.docs.map(d => ({...d.data()}));
      if (curUser && curView === 'gantt') renderGantt();
      setSyncStatus('ok','En línea ✓');
    });

    // Real-time listener for users
    onSnapshot(collection(db,'users'), (snap) => {
      users = snap.docs.map(d => ({id:d.id,...d.data()}));
      if (!curUser) renderLogin();
    });

    fbReady = true;
    setSyncStatus('ok','Conectado a Firebase ✓');
    renderLogin();

  } catch(e) {
    console.error('Firebase init error:', e);
    setSyncStatus('error','Error de conexión');
    // Fallback to localStorage
    toast('⚠️ Sin conexión a Firebase. Usando datos locales.');
    tasks = JSON.parse(localStorage.getItem('gt_tasks') || JSON.stringify(DEFAULT_TASKS));
    users = JSON.parse(localStorage.getItem('gt_users') || JSON.stringify([
      {id:'u1',name:'Bob',email:'',color:AVCOLORS[0]},
      {id:'u2',name:'TI Lead',email:'',color:AVCOLORS[1]},
      {id:'u3',name:'Proveedor',email:'',color:AVCOLORS[2]}
    ]));
    fbReady = false;
    renderLogin();
  }
}

  users.forEach((u, i) => {
    var card = document.createElement('div');
    card.className = 'u-card';
    var hasEmail = u.email && u.email.includes('@');
    card.innerHTML =
      '<div class="av" style="background:'+u.color+'22;color:'+u.color+'">'+ini(u.name)+'</div>'+
      '<div class="u-info">'+
        '<div class="u-name">'+u.name+'</div>'+
        '<div class="u-email'+(hasEmail?'':' missing')+'">'+
          (hasEmail ? '✉ '+u.email : 'Sin correo — agrégalo abajo')+
        '</div>'+
      '</div>';
    card.onclick = () => selectUser(i);
    list.appendChild(card);
  });

  if (editor) {
    editor.innerHTML = users.map((u, i) =>
      '<div class="email-row">'+
        '<div class="email-av" style="background:'+u.color+'22;color:'+u.color+'">'+ini(u.name)+'</div>'+
        '<span class="email-name">'+u.name+'</span>'+
        '<input class="email-inp" type="email" value="'+(u.email||'')+'" placeholder="correo@empresa.com" id="eim-'+i+'">'+
        '<button class="del-btn" onclick="deleteUser('+i+')">✕</button>'+
      '</div>'
    ).join('') +
    '<div style="margin-top:8px;"><button class="btn-add" onclick="saveEmails()" style="font-size:12px;padding:7px;">💾 Guardar correos</button></div>';
  }
}

window.saveEmails = async function() {
  users.forEach((u, i) => {
    var inp = document.getElementById('eim-'+i);
    if (inp) u.email = inp.value.trim();
  });
  if (fbReady) {
    for (const u of users) await setDoc(doc(db,'users',u.id||uid()), u);
  } else {
    localStorage.setItem('gt_users', JSON.stringify(users));
  }
  toast('✅ Correos guardados');
  renderLogin();
};

window.deleteUser = async function(i) {
  if (!confirm('¿Eliminar usuario "'+users[i].name+'"?')) return;
  var uid_del = users[i].id;
  if (fbReady && uid_del) await deleteDoc(doc(db,'users',uid_del));
  users.splice(i,1);
  renderLogin();
};

window.addUser = async function() {
  var nameEl = document.getElementById('inp-name');
  var emailEl = document.getElementById('inp-email');
  var name = nameEl ? nameEl.value.trim() : '';
  var email = emailEl ? emailEl.value.trim() : '';
  if (!name) { alert('Escribe un nombre.'); return; }
  var newUser = { id: uid(), name, email, color: AVCOLORS[users.length % AVCOLORS.length] };
  if (fbReady) {
    await setDoc(doc(db,'users', newUser.id), newUser);
  } else {
    users.push(newUser);
    localStorage.setItem('gt_users', JSON.stringify(users));
    renderLogin();
  }
  if (nameEl) nameEl.value = '';
  if (emailEl) emailEl.value = '';
  toast('✅ Usuario "'+name+'" agregado');
};

function selectUser(i) {
  // Save emails before entering
  users.forEach((u, idx) => {
    var inp = document.getElementById('eim-'+idx);
    if (inp) u.email = inp.value.trim();
  });
  curUser = users[i];
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.body.classList.add('app-mode');
  var av = document.getElementById('cur-av');
  av.textContent = ini(curUser.name);
  av.style.background = curUser.color+'22';
  av.style.color = curUser.color;
  document.getElementById('cur-nm').textContent = curUser.name;
  switchView('gantt');
}

window.logout = function() {
  curUser = null;
  closePanel();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.body.classList.remove('app-mode');
  renderLogin();
};

window.switchView = function(v) {
  curView = v;
  ['gantt','daily','hist'].forEach(x => {
    var el = document.getElementById('view-'+x);
    if (x==='gantt') el.style.display = v==='gantt'?'flex':'none';

window.shiftDays = function(n){ ganttStart=addD(ganttStart,n); renderGantt(); };
window.goToday = function(){
  ganttStart=addD(new Date(),-30); renderGantt();
  setTimeout(()=>{ var bw=document.getElementById('cal-bw'),tl=document.getElementById('tline'); if(!tl.classList.contains('hidden'))bw.scrollLeft=Math.max(0,parseInt(tl.style.left)-200); },100);
};

function renderGantt() {
  var respF = (document.getElementById('resp-fil')||{}).value||'ALL';
  var today = new Date(); today.setHours(0,0,0,0);
  var dates = []; for(var i=0;i<ganttDays;i++) dates.push(addD(ganttStart,i));
  var dl = document.getElementById('date-range-lbl');
  if(dl) dl.textContent = ganttStart.toLocaleDateString('es-MX',{month:'short',day:'numeric',year:'numeric'})+' — '+dates[dates.length-1].toLocaleDateString('es-MX',{month:'short',day:'numeric',year:'numeric'});
  var months=[]; dates.forEach(d=>{ var k=d.getFullYear()+'-'+d.getMonth(); if(!months.length||months[months.length-1].key!==k)months.push({key:k,label:MONTHS_L[d.getMonth()]+' '+d.getFullYear(),count:1}); else months[months.length-1].count++; });
  document.getElementById('month-hd').innerHTML=months.map(m=>'<div class="month-seg" style="min-width:'+(m.count*28)+'px;width:'+(m.count*28)+'px;">'+m.label+'</div>').join('');
  document.getElementById('day-hd').innerHTML=dates.map(d=>{ var isT=ymd(d)===ymd(today),isWE=d.getDay()===0||d.getDay()===6; return '<div class="day-col'+(isT?' tod':'')+(isWE?' we':'')+'"><div class="dow">'+DAYS[d.getDay()][0]+'</div><div class="dom">'+d.getDate()+'</div></div>'; }).join('');
  var filtTasks=respF==='ALL'?tasks:tasks.filter(t=>t.resp===respF);
  var groups=[]; tasks.forEach(t=>{ if(groups.indexOf(t.proj)<0)groups.push(t.proj); });
  var leftHTML=''; var bodyRows=[];
  var allPct=tasks.length?Math.round(tasks.reduce((a,t)=>a+(t.status==='completado'?100:(t.pct||0)),0)/tasks.length):0;
  leftHTML+='<div class="grow grp" style="background:#e8eaed;"><div class="gcell-n"><span style="font-size:12px;font-weight:700;">APP CAFIVER</span></div><div class="gcell-p" style="color:#1c1e21;">'+allPct+'%</div></div>';
  bodyRows.push({type:'overall'});
  groups.forEach(g=>{
    var gAll=tasks.filter(t=>t.proj===g), gF=filtTasks.filter(t=>t.proj===g);
    if(!gAll.length)return;
    var gPct=Math.round(gAll.reduce((a,t)=>a+(t.status==='completado'?100:(t.pct||0)),0)/gAll.length);
    var isC=collapsed.has(g);
    leftHTML+='<div class="grow grp"><div class="gcell-n"><button class="gtog'+(isC?'':' open')+'" onclick="toggleGrp(\''+g.replace(/'/g,"\\'")+'\')">▶</button><span style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+g+'</span></div><div class="gcell-p">'+gPct+'%</div></div>';
    bodyRows.push({type:'grp',g});
    if(!isC){ gF.forEach(t=>{ var ep=t.status==='completado'?100:(t.pct||0); var pC=ep===100?'#34a853':ep>50?'#1a73e8':'#f9ab00'; leftHTML+='<div class="grow" id="lr_'+t.id+'" ondblclick="openPanel(\''+t.id+'\')" onclick="selRow(\''+t.id+'\')"><div class="gcell-n"><div class="task-indent"></div><span class="task-lbl" title="'+t.name+'">'+(t.fav?'⭐ ':'')+t.name+'</span></div><div class="gcell-p" style="color:'+pC+'">'+ep+'%</div></div>'; bodyRows.push({type:'task',t}); }); }
  });
  document.getElementById('gl-body').innerHTML=leftHTML;
  var cb=document.getElementById('cal-b'); cb.style.width=(ganttDays*28)+'px'; cb.innerHTML='';
  bodyRows.forEach(row=>{
    var rd=document.createElement('div'); rd.className='cal-row'+(row.type==='grp'||row.type==='overall'?' grp-r':'');
    dates.forEach(d=>{ var isWE=d.getDay()===0||d.getDay()===6,isT=ymd(d)===ymd(today); var c=document.createElement('div'); c.className='dcell'+(isWE?' we':'')+(isT?' tod':''); rd.appendChild(c); });
    if(row.type==='task'&&row.t.start&&row.t.end){
      var t=row.t,ts=pd(t.start),te=pd(t.end),s0=pd(ymd(ganttStart));
      var left=dBetween(s0,ts),width=Math.max(1,dBetween(ts,te)+1);
      var lPx=left*28,wPx=width*28-2;
      if(lPx<ganttDays*28&&lPx+wPx>0){
        var bc=BAR_COLORS[t.resp]||'#1a73e8',ep=t.status==='completado'?100:(t.pct||0);
        var bar=document.createElement('div'); bar.className='bar'; bar.style.left=Math.max(0,lPx)+'px'; bar.style.width=wPx+'px'; bar.title=t.name+' — '+ep+'%';
        bar.innerHTML='<div class="bar-bg" style="background:'+bc+';opacity:.22;"></div><div class="bar-fill" style="width:'+ep+'%;background:'+bc+';opacity:.88;"></div><span class="bar-txt">'+t.name+'</span>';
        bar.ondblclick=()=>openPanel(t.id); bar.onclick=e=>{e.stopPropagation();selRow(t.id);}; rd.appendChild(bar);
      }
    }
    cb.appendChild(rd);
  });
  var tl=document.getElementById('tline'),tOff=dBetween(pd(ymd(ganttStart)),today);
  if(tOff>=0&&tOff<ganttDays){tl.style.left=(tOff*28+14)+'px';tl.classList.remove('hidden');}else tl.classList.add('hidden');
  var bw=document.getElementById('cal-bw'),gb=document.getElementById('gl-body');
  bw.onscroll=()=>{ gb.scrollTop=bw.scrollTop; document.getElementById('day-hd').style.marginLeft=(-bw.scrollLeft)+'px'; document.getElementById('month-hd').style.marginLeft=(-bw.scrollLeft)+'px'; };
  gb.onscroll=e=>{ bw.scrollTop=e.target.scrollTop; };
}

window.toggleGrp = function(g){ if(collapsed.has(g))collapsed.delete(g);else collapsed.add(g); renderGantt(); };
window.selRow = function(tid){ document.querySelectorAll('.grow.sel').forEach(e=>e.classList.remove('sel')); var el=document.getElementById('lr_'+tid); if(el)el.classList.add('sel'); };

window.openPanel = function(tid) {

window.closePanel = function(){
  document.getElementById('dp').classList.remove('open'); document.getElementById('dp-overlay').classList.remove('on');

window.syncSlider = function(){
  var v=parseInt(document.getElementById('dp-pct-n').value)||0;
  document.getElementById('dp-pct-s').value=v; document.getElementById('dp-pct-bar').style.width=v+'%';
};

window.dpSave = async function(field, val) {
  var t=tasks.find(x=>x.id===openTaskId);
  if(!t){ toast('⚠️ Tarea no encontrada en memoria'); return; }
  var prevAssign=t.assign||'';
  if(field==='pct'){t.pct=parseInt(val)||0;if(t.pct===100)t.status='completado';}
  else t[field]=val;
  t.updBy=curUser?curUser.name:''; t.updTs=nowStr();
  if(field==='assign') notifyAssign(t, prevAssign);
  // Update local array immediately
  var idx=tasks.findIndex(x=>x.id===t.id);
  if(idx>=0) tasks[idx]=Object.assign({},t);
  // Save to Firebase
  if(fbReady){
    await fbSaveTask(Object.assign({},t));
  } else {
    localStorage.setItem('gt_tasks', JSON.stringify(tasks));
    toast('Guardado localmente');
  }
  // Refresh gantt if open
  if(curView==='gantt') renderGantt();
};

window.dpFav = async function(){
  var t=tasks.find(x=>x.id===openTaskId); if(!t)return;
  t.fav=!t.fav; document.getElementById('dp-fav').textContent=t.fav?'⭐':'☆';
  await fbSaveTask(t); toast(t.fav?'Favorito agregado':'Favorito removido');
};

window.dpDelete = function(){
  var t=tasks.find(x=>x.id===openTaskId); if(!t)return;
  confirmAction('¿Eliminar "'+t.name.slice(0,50)+'"?','Esta acción no se puede deshacer.',async ()=>{
    await fbDeleteTask(t.id);
    tasks=tasks.filter(x=>x.id!==openTaskId);
    closePanel(); renderGantt(); toast('Tarea eliminada');
  });
};

        '<div class="dp-fr"><div class="dp-fk">Responsable</div><div class="dp-fv"><select onchange="dpSave(\'resp\',this.value)">'+rOpts.map(o=>'<option value="'+o.v+'"'+(t.resp===o.v?' selected':'')+'>'+o.l+'</option>').join('')+'</select></div></div>'+
        '<div class="dp-fr"><div class="dp-fk">Asignado a</div><div class="dp-fv"><input type="text" value="'+((t.assign||'').replace(/"/g,'&quot;'))+'" onchange="dpSave(\'assign\',this.value)"></div></div>'+
        '<div class="dp-fr"><div class="dp-fk">Proyecto</div><div class="dp-fv"><select onchange="dpSave(\'proj\',this.value)">'+groups.map(p=>'<option value="'+p+'"'+(t.proj===p?' selected':'')+'>'+p+'</option>').join('')+'</select></div></div>'+
        '<div class="dp-fr"><div class="dp-fk">Duración</div><div class="dp-fv" style="font-size:12px;font-weight:500;">'+dur+'</div></div>'+
        '<div class="dp-fr"><div class="dp-fk">Parent Group</div><div class="dp-fv" style="font-size:12px;">'+t.proj+'</div></div>'+
        '<div class="dp-fr"><div class="dp-fk">Type</div><div class="dp-fv" style="font-size:12px;">Task</div></div>'+
      '</div>'+
      '<div class="dp-sec"><div class="dp-sec-t">Semáforo</div><div class="sem-row">'+
        ['g','y','r'].map(v=>'<div class="sem-opt sem-'+v+(t.sem===v?' on':'')+'" onclick="dpSave(\'sem\',\''+v+'\');dpTab(\'details\')"><span class="semdot" style="background:'+(v==='g'?'#34a853':v==='y'?'#f9ab00':'#ea4335')+'"></span>'+(v==='g'?'En tiempo':v==='y'?'En riesgo':'Atrasado')+'</div>').join('')+
      '</div></div>'+
      '<div class="dp-sec"><div class="dp-sec-t">Predecessors</div>'+
        (predT?'<div class="pred-item"><span style="color:#9aa0a6;font-size:10px;">↑</span>'+predT.name+'</div>':
          '<div class="no-pred">No predecessors added yet.</div><input type="text" placeholder="Tarea predecesora..." style="width:100%;font-size:12px;padding:5px 8px;border:1.5px solid #e0e2e6;border-radius:6px;margin-top:6px;" value="'+(t.dep||'')+'" onchange="dpSave(\'dep\',this.value)">')+
      '</div>'+
      '<div class="dp-sec"><div class="dp-sec-t">Successors</div>'+
        (succT.length?succT.map(s=>'<div class="pred-item"><span style="color:#9aa0a6;font-size:10px;">↓</span>'+s.name+'</div>').join(''):'<div class="no-pred">No successors registered.</div>')+
      '</div>'+
      '<div class="dp-sec"><div class="dp-sec-t">Última modificación</div>'+
        '<div style="font-size:12px;color:#5f6368;">'+(t.updBy?t.updBy+' — '+t.updTs:'Sin modificaciones.')+

      '<input class="c-inp" type="text" id="c-inp" placeholder="Add a comment..." onkeydown="if(event.key===\'Enter\')addComment()"></div>'+
      (tC.length?tC.map(c=>'<div class="c-item"><div class="c-av" style="background:'+c.color+'22;color:'+c.color+'">'+ini(c.user)+'</div><div class="c-txt"><div class="c-author">'+c.user+'</div><div class="c-body">'+c.text+'</div><div class="c-time">'+c.ts+'</div></div></div>').join('')
        :'<div style="font-size:12px;color:#9aa0a6;padding:8px 0;">Sin comentarios aún.</div>');
  }

window.renderDailyContent = function(){
  var dk=(document.getElementById('daily-date')||{}).value||new Date().toISOString().slice(0,10);
  var logs=dailyLogs.filter(l=>l.date===dk);
  var stLbl={pendiente:'Pendiente','en progreso':'En progreso',completado:'Completado',bloqueado:'Bloqueado'};
  var html='<div class="tbl-box" style="margin-bottom:12px;"><div class="tbl-hdr"><span>Registros — '+logs.length+' entrada(s)</span><button class="btn btn-sm" onclick="exportDay(\''+dk+'\')">⬇ CSV</button></div>';
  if(logs.length){
    html+='<div style="overflow-x:auto;"><table><thead><tr>'+['Hora','Usuario','Tarea','Estado','%','Sem.','Comentario',''].map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
      logs.map(l=>{ var sc=l.sem==='g'?'#34a853':l.sem==='y'?'#f9ab00':'#ea4335';
        return '<tr><td style="font-family:monospace;white-space:nowrap;">'+l.time+'</td>'+
          '<td><span style="display:inline-flex;width:18px;height:18px;border-radius:50%;background:'+l.userColor+'22;color:'+l.userColor+';align-items:center;justify-content:center;font-size:8px;font-weight:700;margin-right:4px;">'+ini(l.user)+'</span>'+l.user+'</td>'+
          '<td style="font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+l.taskName+'</td>'+
          '<td>'+(stLbl[l.status]||l.status)+'</td><td style="font-weight:700;">'+l.pct+'%</td>'+
          '<td style="text-align:center;"><span style="width:10px;height:10px;border-radius:50%;display:inline-block;background:'+sc+';"></span></td>'+
          '<td style="color:#5f6368;">'+(l.comment||'—')+'</td>'+
          '<td><button class="btn btn-sm" onclick="deleteLog(\''+l.id+'\')">🗑</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  }else html+='<div class="empty-state">Sin registros para este día.</div>';
  html+='</div><div class="tbl-box"><div class="tbl-hdr"><span>+ Nuevo registro</span></div>'+
    '<div style="padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;">'+
    '<div><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">Tarea</label>'+
    '<select id="log-task" onchange="prefillLog()" style="min-width:220px;font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;">'+tasks.map(t=>'<option value="'+t.id+'">'+t.name.slice(0,55)+'</option>').join('')+'</select></div>'+
    '<div><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">Estado</label>'+
    '<select id="log-status" style="font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;"><option value="pendiente">Pendiente</option><option value="en progreso">En progreso</option><option value="completado">Completado</option><option value="bloqueado">Bloqueado</option></select></div>'+
    '<div><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">% Avance</label>'+
    '<input type="number" id="log-pct" min="0" max="100" value="0" style="width:70px;font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;"></div>'+
    '<div><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">Semáforo</label>'+
    '<select id="log-sem" style="font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;"><option value="g">🟢 En tiempo</option><option value="y">🟡 En riesgo</option><option value="r">🔴 Atrasado</option></select></div>'+
    '<div style="flex:1;min-width:150px;"><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">Comentario</label>'+
    '<input type="text" id="log-comment" placeholder="¿Qué avanzaste hoy?" style="width:100%;font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;"></div>'+
    '<button class="btn btn-blue" onclick="addLog(\''+dk+'\')">+ Registrar</button></div></div>';
  document.getElementById('daily-inner').innerHTML=html;
  prefillLog();
};

window.prefillLog = function(){
  var tid=(document.getElementById('log-task')||{}).value;
  var t=tasks.find(x=>x.id===tid);
  if(t){ document.getElementById('log-status').value=t.status; document.getElementById('log-pct').value=t.pct||0; document.getElementById('log-sem').value=t.sem; }
};

window.addLog = async function(dk){
  var tid=document.getElementById('log-task').value;
  var t=tasks.find(x=>x.id===tid); if(!t)return;
  var status=document.getElementById('log-status').value;
  var pct=Math.min(100,Math.max(0,parseInt(document.getElementById('log-pct').value)||0));
  var sem=document.getElementById('log-sem').value;
  var comment=document.getElementById('log-comment').value.trim();
  var now=new Date(), time=now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  var log={id:uid(),date:dk,time,taskId:tid,taskName:t.name,taskProj:t.proj,user:curUser.name,userColor:curUser.color,status,pct,sem,comment};
  dailyLogs.push(log);
  await setDoc(doc(db,'dailylogs',log.id), log);
  t.status=status; t.pct=pct; t.sem=sem; if(pct===100)t.status='completado';
  t.updBy=curUser.name; t.updTs=nowStr();
  await fbSaveTask(t);
  renderDailyContent(); toast('Registro guardado');
};

window.deleteLog = async function(lid){
  confirmAction('¿Eliminar registro?','Esta acción no se puede deshacer.',async ()=>{
    await deleteDoc(doc(db,'dailylogs',lid));
    dailyLogs=dailyLogs.filter(x=>x.id!==lid);
    renderDailyContent(); toast('Eliminado');
  });
};

window.exportDay = function(dk){
  var logs=dailyLogs.filter(l=>l.date===dk); if(!logs.length){toast('Sin registros');return;}
  var csv='Hora,Usuario,Proyecto,Tarea,Estado,% Avance,Semáforo,Comentario\n';
  logs.forEach(l=>csv+=l.time+',"'+l.user+'","'+l.taskProj+'","'+l.taskName+'","'+l.status+'",'+l.pct+'%,"'+(l.sem==='g'?'Verde':l.sem==='y'?'Amarillo':'Rojo')+'","'+(l.comment||'')+'"\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})); a.download='reporte_'+dk+'.csv'; a.click(); toast('CSV exportado');
};

// ═══════════════════════════════════════════
// HISTORIAL
// ═══════════════════════════════════════════
function renderHist(){
  var wrap=document.getElementById('hist-wrap');
  if(!history.length){wrap.innerHTML='<div class="empty-state">Sin historial aún.</div>';return;}
  wrap.innerHTML='<div class="tbl-box"><table><thead><tr>'+
    ['Fecha/hora','Usuario','Proyecto','Tarea','Campo','Valor'].map(h=>'<th>'+h+'</th>').join('')+
    '</tr></thead><tbody>'+
    history.slice(0,150).map(h=>'<tr>'+
      '<td style="font-family:monospace;white-space:nowrap;font-size:11px;">'+h.ts+'</td>'+
      '<td><span style="display:inline-flex;width:18px;height:18px;border-radius:50%;background:'+h.color+'22;color:'+h.color+';align-items:center;justify-content:center;font-size:8px;font-weight:700;margin-right:4px;">'+ini(h.user)+'</span>'+h.user+'</td>'+
      '<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;">'+h.proj+'</td>'+
      '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+h.task+'</td>'+
      '<td style="font-size:11px;">'+h.campo+'</td>'+
      '<td style="font-weight:600;">'+h.val+'</td></tr>').join('')+
    '</tbody></table></div>';
}

// ═══════════════════════════════════════════
// CONFIRM
// ═══════════════════════════════════════════
var _cb=null;
window.confirmAction = function(title,msg,cb){ _cb=cb; document.getElementById('confirm-title').textContent=title; document.getElementById('confirm-msg').textContent=msg; document.getElementById('confirm-overlay').classList.remove('hidden'); };
window.closeConfirm = function(){ document.getElementById('confirm-overlay').classList.add('hidden'); _cb=null; };
document.getElementById('confirm-ok').onclick=function(){ if(_cb)_cb(); closeConfirm(); };

// ═══════════════════════════════════════════
// START
// ═══════════════════════════════════════════
initFirebase();
</script>
